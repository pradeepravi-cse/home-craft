version: '3.8'

# ─────────────────────────────────────────────────────────────────
#  Preethys' Business — Production deployment (Synology NAS)
#
#  Prerequisites on the NAS (run once via SSH):
#    mkdir -p /volume1/docker/pleat-perfect/postgres
#    chmod 700 /volume1/docker/pleat-perfect/postgres
#
#  Deploy:
#    docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
#  Update (rebuild images):
#    docker compose -f docker-compose.prod.yml --env-file .env up -d --build --remove-orphans
#
#  Logs:
#    docker compose -f docker-compose.prod.yml logs -f
# ─────────────────────────────────────────────────────────────────

services:

  # ── Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pleat-perfect-db
    restart: always
    environment:
      POSTGRES_DB: pleat_perfect
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Stored in File Station → docker/pleat-perfect/postgres
      - /volume1/docker/pleat-perfect/postgres:/var/lib/postgresql/data
    networks:
      - app-network
    # Do NOT expose port 5432 to the host in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d pleat_perfect"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pleat-perfect-backend:latest
    container_name: pleat-perfect-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/pleat_perfect
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    # Not exposed to host — Nginx proxies to it internally
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Frontend (nginx serving React SPA) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: pleat-perfect-frontend:latest
    container_name: pleat-perfect-web
    restart: always
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Reverse Proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pleat-perfect-nginx
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge
