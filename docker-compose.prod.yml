version: '3.8'

# ─────────────────────────────────────────────────────────────────
#  Preethys' Business — Production deployment (Synology NAS, ~4GB RAM)
#
#  Runs ONLY: postgres + backend API + cloudflared.
#  The frontend is hosted on Cloudflare Pages — it is NOT part of
#  this stack. The Pages app calls the API via the tunnel hostname
#  (set VITE_API_URL in the Pages build to that URL).
#
#  Cloudflare Tunnel public hostname → http://backend:3000
#
#  Images are pulled from Docker Hub (built by GitHub Actions:
#  .github/workflows/docker-publish.yml). No local builds in prod.
#
#  Prerequisites on the NAS (run once via SSH):
#    mkdir -p /volume1/docker/homecraft/postgres
#    chmod 700 /volume1/docker/homecraft/postgres
#
#  Deploy / update to newest images:
#    docker compose -f docker-compose.prod.yml --env-file .env pull
#    docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
#
#  Pin a version: set IMAGE_TAG=1.2.3 in .env (defaults to latest)
#
#  Memory budget (limits): postgres 512M + api 512M + cloudflared
#  128M = ~1.2G of 4G — plenty of headroom for DSM.
# ─────────────────────────────────────────────────────────────────

services:

  # ── Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: homecraft-db
    restart: always
    environment:
      POSTGRES_DB: homecraft
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Stored in File Station → docker/homecraft/postgres
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    # Do NOT expose port 5432 to the host in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d homecraft"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend API ───────────────────────────────────────────────
  backend:
    image: pradeepravi/homecraft-api:${IMAGE_TAG:-latest}
    container_name: homecraft-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      # Cap V8 heap below the container limit so Node degrades
      # gracefully instead of being OOM-killed by the kernel
      NODE_OPTIONS: --max-old-space-size=384
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/homecraft
      DB_SCHEMA: ${DB_SCHEMA:-public}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      APP_NAME: ${APP_NAME:-HomeCraft}
      APP_URL: ${APP_URL}
      # CORS allow-list — must include the Cloudflare Pages origin(s),
      # comma-separated (e.g. https://homecraft.pages.dev)
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FROM_EMAIL: ${FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    # Not exposed to host — cloudflared reaches it on the compose network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Cloudflare Tunnel (exposes the API) ───────────────────────
  # Token-based, remotely managed tunnel. Create it in the
  # Cloudflare dashboard (Zero Trust → Networks → Tunnels), point
  # the public hostname at http://backend:3000, and put the token
  # in .env as TUNNEL_TOKEN. No ports are exposed on the host.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homecraft-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  app-network:
    driver: bridge
